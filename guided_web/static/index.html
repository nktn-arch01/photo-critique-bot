<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumina Notes — Guided</title>
  <link rel="stylesheet" href="/static/guided.css" />
</head>
<body>
  <header class="app-header">
    <h1>Lumina Notes</h1>
    <nav class="screen-nav" aria-label="画面">
      <button type="button" class="active" data-screen="choose">選ぶ</button>
      <button type="button" data-screen="read">読む</button>
      <button type="button" data-screen="reflect">振り返る</button>
    </nav>
  </header>

  <main id="screen-choose" class="screen active">
    <section class="drop-zone" id="drop-zone">
      <img id="photo-preview" class="photo-preview" alt="選んだ写真" hidden />
      <p class="drop-hint">写真をドラッグ＆ドロップ</p>
      <button type="button" id="pick-file">写真を選ぶ</button>
      <input type="file" id="file-input" accept="image/*" hidden />
    </section>
    <label class="field">一言添えるなら（任意）
      <textarea id="user-note" rows="2"></textarea>
    </label>
    <label class="field">スタイルを選択
      <select id="lens-select">
        <option value="self">自分の写真と対話</option>
      </select>
    </label>
    <div class="actions choose-actions split-actions">
      <button type="button" id="btn-reset" class="secondary">クリア</button>
      <button type="button" id="btn-speak" disabled>言葉にする</button>
    </div>
    <section id="params-preview" class="params-preview" hidden aria-labelledby="params-heading">
      <h2 id="params-heading" class="params-heading">抽出パラメータ</h2>
      <div id="params-preview-body" class="params-preview-body"></div>
    </section>
  </main>

  <main id="screen-read" class="screen" hidden>
    <img id="read-photo-preview" class="photo-preview read-photo" alt="選んだ写真" hidden />
    <div id="read-skeleton" class="skeleton" hidden>いま写真を読んでいます…</div>
    <p id="read-empty-hint" class="read-hint" hidden>選ぶで写真を選んでください。</p>
    <div id="read-compact-wrap" class="read-compact" hidden>
      <h2 id="read-title" class="read-title"></h2>
      <p id="read-summary" class="read-summary"></p>
      <p id="read-point" class="read-point"></p>
      <p id="read-phase2-hint" class="read-hint" hidden>詳しい言葉を読み込んでいます…</p>
    </div>
    <div id="read-actions" class="actions split-actions read-actions" hidden>
      <button type="button" id="btn-again" class="secondary">もう一度</button>
      <button type="button" id="btn-keep">この言葉を残す</button>
    </div>
    <article id="read-detail" class="read-detail" hidden>
      <details id="detail-scores" class="read-details">
        <summary>観察の輪郭</summary>
        <div id="read-scores"></div>
      </details>
      <div id="read-sections"></div>
    </article>
  </main>

  <main id="screen-reflect" class="screen" hidden>
    <div class="card-preview-wrap">
      <img id="card-preview-img" class="card-preview-img" alt="カードプレビュー" hidden />
      <p id="card-preview-loading" class="card-preview-loading">カードを準備しています…</p>
    </div>
    <fieldset class="field">
      <legend>この写真に対する思い <span class="required">必須</span></legend>
      <div id="user-stars" class="user-stars" role="radiogroup" aria-label="思いの星">
        <button type="button" data-value="1" aria-label="1">☆</button>
        <button type="button" data-value="2" aria-label="2">☆</button>
        <button type="button" data-value="3" aria-label="3">☆</button>
        <button type="button" data-value="4" aria-label="4">☆</button>
        <button type="button" data-value="5" aria-label="5">☆</button>
      </div>
    </fieldset>
    <label class="field">カードの色
      <select id="card-theme">
        <option value="dark">ダーク</option>
        <option value="light">ライト</option>
      </select>
    </label>
    <label class="field">一言添えるなら（任意）
      <textarea id="reflect-user-note" rows="2"></textarea>
    </label>
    <fieldset class="field reflect-checklist" aria-label="振り返り">
      <div id="reflect-checklist" class="reflect-checklist-body"></div>
    </fieldset>
    <div class="actions reflect-actions split-actions">
      <span></span>
      <button type="button" id="btn-export" disabled>Noteに書き出す</button>
    </div>
  </main>

  <script src="/static/guided.js?v=11"></script>
</body>
</html>
