name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exiftool (IPTC Rating/Description I/O)
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pillow line-bot-sdk openai fastapi uvicorn python-multipart httpx

      - name: Run offline regression tests
        run: python test_offline_suite.py
